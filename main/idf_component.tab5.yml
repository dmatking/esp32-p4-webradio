dependencies:
  idf: ">=5.3"
  # Match the C6 slave firmware (v2.12.3) on the host side. The older 2.12.0
  # boot assert (esp_startup_start_app) is fixed by 2.12.3 — verified on the P4
  # via esp32-terminal, which runs this exact set.
  espressif/esp_hosted: "==2.12.3"
  espressif/esp_wifi_remote: "==1.5.0"
  chmorgan/esp-libhelix-mp3: "*"
  espressif/esp-dsp: ">=0.3.0"
  # M5Stack Tab5: ES8388 codec via esp_codec_dev, ST7123 capacitive touch.
  espressif/esp_codec_dev: ">=1.0.0"
  espressif/esp_lcd_touch_st7123: ">=1.0.0"
